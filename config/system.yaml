# 系统全局配置
# 包含日志、服务器、LLM 默认模型、消息总线、记忆系统等
# 字段参考: backend/src/core/config.py -> SystemConfig 及其子模型

# 系统元数据
system:
  name: "Multi-Agent Code System"
  version: "0.2.0"
  debug: false

# 日志配置
logging:
  level: "INFO"            # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "console"        # "json" (结构化) 或 "console" (人类可读)

# FastAPI 服务器配置
server:
  host: "127.0.0.1"
  port: 8001
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
  # A11 全局访问密码门禁
  # 空字符串等于不开启门禁；公网部署时建议配 HTTPS + 高熵密码
  access_password: ""
  failed_login_lockout_seconds: 60     # 失败计数滑动窗口（秒）
  failed_login_max_attempts: 5         # 滑动窗口内最大失败次数，超过即锁定到下个窗口

# LLM 默认配置
# 可被环境变量覆盖:
#   LLM_PROVIDER, LLM_API_KEY, LLM_MODEL, LLM_BASE_URL,
#   LLM_TEMPERATURE, LLM_TOP_P, LLM_MAX_TOKENS, LLM_STOP_SEQUENCES,
#   OPENAI_MAX_COMPLETION_TOKENS, OPENAI_USE_LEGACY_MAX_TOKENS,
#   OPENAI_PRESENCE_PENALTY, OPENAI_FREQUENCY_PENALTY,
#   OPENAI_REASONING_EFFORT, OPENAI_SEED, ANTHROPIC_TOP_K
llm:
  provider: "openai"             # openai | anthropic
  api_key: ""                    # 建议通过环境变量 LLM_API_KEY 设置
  model: "gpt-3.5-turbo"        # 默认模型
  base_url: "https://cpa.chordvers.org/v1"                   # 自定义 API 地址（留空使用官方端点）
  temperature: 0.7
  top_p: null
  max_tokens: 4096
  stop_sequences: []
  max_retries: 3                # A6: 总重试次数（不含首发），仅瞬态错误才重试
  retry_initial_delay: 1.0      # A6: 首次退避秒数；之后 ×2 + ±20% jitter
  openai:
    max_completion_tokens: null
    use_legacy_max_tokens: false # 兼容旧式 OpenAI 代理时可开启
    presence_penalty: null
    frequency_penalty: null
    reasoning_effort: ""         # minimal | low | medium | high | xhigh
    seed: null
  anthropic:
    top_k: null

# 消息总线配置 (可被环境变量覆盖: BUS_QUEUE_SIZE, BUS_HISTORY_SIZE)
bus:
  queue_size: 1000               # 消息队列大小，0 为无限
  history_size: 500              # 消息历史保留数量

# 记忆系统配置 (可被环境变量覆盖: MEMORY_BACKEND, MEMORY_PERSIST_DIR)
memory:
  backend: "chroma"              # 默认 ChromaDB 持久化；开发测试可用 "memory"
  persist_dir: "./data/chroma"
  collection_name: "agent_memories"
  auto_reflection_enabled: true # 是否自动从完整对话回合中反思形成长期记忆
  reflection_min_turns: 3         # 默认累计 3 轮后反思；显著偏好/待办/项目决策可提前触发
  reflection_max_messages: 12     # 每次反思最多纳入最近多少条消息
  recall_max_results: 3            # 默认注入 Assistant prompt 的召回记忆数量
  recall_max_chars: 1200           # 默认召回上下文字符预算
  recall_score_threshold: 0.0      # 召回综合分数阈值，低于该值不注入
  fallback_to_memory_on_error: true # chromadb 缺失/初始化失败时清晰提示并降级内存
  consolidation_threshold: 0.3      # 巩固/近似去重相似度阈值
  forget_after_days: 1              # 低重要性记忆超过 1 天未访问后进入手动遗忘周期候选
  forget_min_importance: 0.3        # 遗忘的重要性阈值

# 上下文管理配置
context:
  persist_dir: "./data/context"  # 项目上下文持久化目录

# 工具运行配置
# 可被环境变量覆盖:
#   WEB_SEARCH_PROVIDER, WEB_SEARCH_BASE_URL, WEB_SEARCH_API_KEY,
#   WEB_SEARCH_MAX_RESULTS, WEB_SEARCH_TIMEOUT,
#   WEB_FETCH_TIMEOUT, WEB_FETCH_MAX_CHARS,
#   AGENTIC_WORKSPACE_ROOT, ENABLE_SHELL_TOOL, SHELL_TOOL_TIMEOUT
tools:
  web_search:
    provider: "duckduckgo"       # duckduckgo | brave | serper
    base_url: ""                 # 留空使用 provider 默认地址
    api_key: ""                  # brave/serper 等需要 Key；建议用环境变量
    max_results: 5
    timeout: 10
  web_fetch:
    timeout: 10
    max_chars: 4000
  file:
    workspace_root: "./workspace"  # 默认项目根目录下 ./workspace；可用 AGENTIC_WORKSPACE_ROOT 覆盖
  shell:
    enabled: false               # 默认关闭，避免任意命令执行
    timeout: 30
  custom: {}                     # 未来工具的 URL/Key/extra 参数，Key 不会通过 API 明文返回

# Agent 创建 / 更新时的工具黑名单 (A4 escape hatch)
# 默认空列表 = 不锁任何工具，HIGH_RISK_TOOLS 已全放开。
# 部署方需要锁定时填上对应工具名，例如：
# agent_creation:
#   forbidden_tools: [bash, dispatch_agent]
agent_creation:
  forbidden_tools: []

# dispatch_agent 嵌套深度上限 (A10 Plan Task 11)
# 默认 5（>= 该值即拒绝再嵌套派生），从硬编码 1 放开。
# 部署方可调小到 1~2 锁住嵌套，或调大到 10 让多 Agent 协作能更深委派。
dispatch:
  max_depth: 5
